[project]
name = "golden"
version = "0.1.0"
description = "Personal Finance App — single-user local budget manager"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.115.0",
    "uvicorn[standard]==0.30.6",
    "sqlalchemy==2.0.36",
    "alembic==1.13.3",
    "pydantic==2.9.2",
    "jinja2==3.1.4",
    "python-multipart==0.0.12",
    "aiofiles==24.1.0",
]

[dependency-groups]
dev = [
    "pytest==8.3.3",
    "pytest-asyncio==0.24.0",
    "httpx==0.27.2",
]

[tool.uv]
link-mode = "copy"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
norecursedirs = [".venv", ".git", "__pycache__"]
