[project]
name = "golden"
version = "0.1.0"
description = "Personal Finance App — single-user local budget manager"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.130.0",
    "uvicorn[standard]==0.49.0",
    "sqlalchemy==2.0.51",
    "alembic==1.18.4",
    "pydantic==2.13.4",
    "jinja2==3.1.6",
    "python-multipart==0.0.32",
    "aiofiles==25.1.0",
]

[dependency-groups]
dev = [
    "pytest==9.1.0",
    "pytest-asyncio==1.4.0",
    "httpx==0.28.1",
]

[tool.uv]
link-mode = "copy"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
norecursedirs = [".venv", ".git", "__pycache__"]
