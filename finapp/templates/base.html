<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{% block title %}Personal Finance App{% endblock %}</title>

    <!-- Tailwind CSS (Play CDN) -->
    <script src="https://cdn.tailwindcss.com" integrity="sha384-ZOxlONqYT8A/gUxhJkXJP2pC2wqaX4yWvC4u6hLZwl3MFjL2YqDvXfS4t2Rq4nNd" crossorigin="anonymous"></script>

    <!-- HTMX -->
    <script src="https://unpkg.com/htmx.org@1.9.10" integrity="sha384-D1Kt99CQMDuVeK5mXA0C5n9+fFplnTmHpSvHO1RJkCMw3f/DxmlJ8oPjGELHNWuLQ" crossorigin="anonymous"></script>

    <!-- Alpine.js (optional, for UI toggles) -->
    <script defer src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js" integrity="sha384-nVDQlWJywQyB56zNON36OfWJM0l6w1wHfM2OqsNUC8kxpGR/VhknP0rhjKSmvAv4M" crossorigin="anonymous"></script>

    <!-- Chart.js (for debt/savings projections) -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.js" integrity="sha384-TN3Hv5OYYP5+bL1s6K4qYaZrQ3zGfGSVVaWatDh6f3nXj0Gh6bUvCNGYLQV/B3Vhm" crossorigin="anonymous"></script>

    <style>
        :root {
            /* Color palette per design spec */
            --color-success: #10b981;
            --color-warning: #f59e0b;
            --color-danger: #ef4444;
            --color-info: #3b82f6;
            --color-accent: #0ea5e9;
        }

        body {
            @apply bg-gray-50 text-gray-900;
        }

        /* Layout variables for responsive nav */
        @media (min-width: 768px) {
            body {
                margin-left: 16rem; /* 256px sidebar width */
            }
        }

        /* Sidebar (shown at md and above) */
        #sidebar {
            @apply fixed left-0 top-0 h-screen w-64 bg-white border-r border-gray-200 shadow-sm;
            @apply hidden md:flex md:flex-col;
            z-index: 50;
            overflow-y: auto;
        }

        #sidebar-nav {
            @apply flex-1 px-4 py-6 space-y-1;
        }

        #sidebar-nav a,
        #sidebar-nav button {
            @apply block w-full px-4 py-3 text-left rounded-lg text-gray-700 font-medium
                   transition-colors duration-200;
            @apply hover:bg-gray-100 hover:text-gray-900;
        }

        #sidebar-nav a.active,
        #sidebar-nav button.active {
            @apply bg-blue-50 text-blue-600 border-l-4 border-blue-600 pl-3;
        }

        /* Sidebar footer with Add Transaction button */
        #sidebar-footer {
            @apply px-4 py-4 border-t border-gray-200;
        }

        /* Bottom navigation (shown below md) */
        #bottom-nav {
            @apply fixed bottom-0 left-0 right-0 bg-white border-t border-gray-200 shadow-lg;
            @apply block md:hidden;
            z-index: 50;
        }

        #bottom-nav-items {
            @apply flex justify-around items-center h-20 px-2;
        }

        #bottom-nav-items a,
        #bottom-nav-items button {
            @apply flex flex-col items-center justify-center w-16 h-16 rounded-lg
                   text-gray-600 text-xs font-medium transition-colors duration-200;
            @apply hover:text-blue-600 hover:bg-blue-50;
        }

        #bottom-nav-items a.active,
        #bottom-nav-items button.active {
            @apply text-blue-600 bg-blue-50;
        }

        /* Icon styles for nav items */
        .nav-icon {
            @apply w-6 h-6 mb-1;
        }

        /* Main content area */
        #main-content {
            @apply min-h-screen px-4 py-6 md:px-8 md:py-8;
            @apply pb-24 md:pb-8; /* Bottom padding to accommodate bottom nav on mobile */
        }

        /* Add Transaction button styles */
        .btn-add-transaction {
            @apply inline-flex items-center justify-center px-4 py-2 rounded-lg font-medium
                   text-white bg-blue-600 hover:bg-blue-700 transition-colors duration-200;
        }

        .btn-add-transaction-floating {
            @apply fixed bottom-24 md:bottom-8 right-4 md:right-8 p-4 rounded-full
                   text-white bg-blue-600 hover:bg-blue-700 shadow-lg
                   transition-all duration-200 z-40;
            width: 56px;
            height: 56px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Modal styles */
        .modal-backdrop {
            @apply fixed inset-0 bg-black bg-opacity-50 flex items-end md:items-center justify-center;
            z-index: 60;
        }

        .modal-panel {
            @apply bg-white rounded-t-2xl md:rounded-xl w-full md:max-w-md max-h-[90vh]
                   overflow-y-auto shadow-2xl;
        }

        /* Utilities */
        .text-muted {
            @apply text-gray-500;
        }

        .text-success {
            color: var(--color-success);
        }

        .text-warning {
            color: var(--color-warning);
        }

        .badge-count {
            @apply inline-flex items-center justify-center w-5 h-5 text-xs font-bold
                   text-white bg-amber-500 rounded-full;
        }

        /* Responsive adjustments */
        @media (max-width: 767px) {
            body {
                margin-left: 0;
            }
        }
    </style>

    {% block extra_css %}{% endblock %}
</head>

<body>
    <!-- Sidebar (desktop) -->
    <aside id="sidebar">
        <div class="px-6 py-6 border-b border-gray-200">
            <h1 class="text-xl font-bold text-gray-900">FinApp</h1>
            <p class="text-sm text-gray-500">Budget & Goals</p>
        </div>

        <nav id="sidebar-nav">
            <a href="/dashboard" class="nav-item" data-route="dashboard">
                <svg class="nav-icon" fill="currentColor" viewBox="0 0 24 24">
                    <path d="M3 13h2v8H3zm4-8h2v16H7zm4-2h2v18h-2zm4-2h2v20h-2zm4 4h2v16h-2z" />
                </svg>
                Dashboard
            </a>
            <a href="/budget" class="nav-item" data-route="budget">
                <svg class="nav-icon" fill="currentColor" viewBox="0 0 24 24">
                    <path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zM9 17H7v-7h2v7zm4 0h-2V7h2v10zm4 0h-2v-4h2v4z" />
                </svg>
                Budget
            </a>
            <a href="/transactions" class="nav-item" data-route="transactions">
                <svg class="nav-icon" fill="currentColor" viewBox="0 0 24 24">
                    <path d="M9 5H7v14h2V5zm4 0h-2v14h2V5zm4 0h-2v14h2V5zm5-2h-1V2h-2v1H8V2H6v1H5c-1.11 0-1.99.9-1.99 2L3 20c0 1.1.89 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm0 16H5V8h14v11z" />
                </svg>
                Transactions
            </a>
            <a href="/debt" class="nav-item" data-route="debt">
                <svg class="nav-icon" fill="currentColor" viewBox="0 0 24 24">
                    <path d="M21 18v1H3v-1s0-4 9-4 9 4 9 4zm-9-12a4 4 0 1 1 0 8 4 4 0 0 1 0-8zM1 20.9V24h22v-3.1c0-3.6-5.9-5.9-11-5.9s-11 2.3-11 5.9z" />
                </svg>
                Debt
            </a>
            <a href="/savings" class="nav-item" data-route="savings">
                <svg class="nav-icon" fill="currentColor" viewBox="0 0 24 24">
                    <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.42 0-8-3.58-8-8s3.58-8 8-8 8 3.58 8 8-3.58 8-8 8zm.5-13H11v6l5.25 3.15.75-1.23-4.5-2.67z" />
                </svg>
                Savings
            </a>
            <a href="/reviews" class="nav-item" data-route="reviews">
                <svg class="nav-icon" fill="currentColor" viewBox="0 0 24 24">
                    <path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm0 16H5V5h14v14zm-5.04-6.71l-2.75 3.54-2.12-2.58-4.27 5.47h12.91L13.96 12.29z" />
                </svg>
                Reviews
            </a>
            <a href="/settings" class="nav-item" data-route="settings">
                <svg class="nav-icon" fill="currentColor" viewBox="0 0 24 24">
                    <path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58c.18-.14.23-.41.12-.62l-1.92-3.32c-.12-.22-.37-.29-.59-.22l-2.39.96c-.5-.4-1.04-.73-1.63-.99l-.36-2.54c-.04-.24-.24-.41-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.26-1.13.59-1.63.99l-2.39-.96c-.22-.09-.47 0-.59.22L2.74 8.87c-.12.21-.08.48.1.62l2.03 1.58c-.05.3-.07.62-.07.94s.02.64.07.94l-2.03 1.58c-.18.14-.23.41-.1.62l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.4 1.04.73 1.63.99l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.26 1.13-.59 1.63-.99l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.48-.12-.62l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z" />
                </svg>
                Settings
            </a>
        </nav>

        <div id="sidebar-footer">
            <button class="btn-add-transaction w-full" onclick="openAddTransactionModal()">
                <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4" />
                </svg>
                Add Transaction
            </button>
        </div>
    </aside>

    <!-- Bottom Navigation (mobile) -->
    <nav id="bottom-nav">
        <div id="bottom-nav-items">
            <a href="/dashboard" class="nav-item" data-route="dashboard">
                <svg class="nav-icon" fill="currentColor" viewBox="0 0 24 24">
                    <path d="M3 13h2v8H3zm4-8h2v16H7zm4-2h2v18h-2zm4-2h2v20h-2zm4 4h2v16h-2z" />
                </svg>
                <span>Dashboard</span>
            </a>
            <a href="/budget" class="nav-item" data-route="budget">
                <svg class="nav-icon" fill="currentColor" viewBox="0 0 24 24">
                    <path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zM9 17H7v-7h2v7zm4 0h-2V7h2v10zm4 0h-2v-4h2v4z" />
                </svg>
                <span>Budget</span>
            </a>
            <a href="/transactions" class="nav-item" data-route="transactions">
                <svg class="nav-icon" fill="currentColor" viewBox="0 0 24 24">
                    <path d="M9 5H7v14h2V5zm4 0h-2v14h2V5zm4 0h-2v14h2V5zm5-2h-1V2h-2v1H8V2H6v1H5c-1.11 0-1.99.9-1.99 2L3 20c0 1.1.89 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm0 16H5V8h14v11z" />
                </svg>
                <span>Trans</span>
            </a>
            <a href="/debt" class="nav-item" data-route="debt">
                <svg class="nav-icon" fill="currentColor" viewBox="0 0 24 24">
                    <path d="M21 18v1H3v-1s0-4 9-4 9 4 9 4zm-9-12a4 4 0 1 1 0 8 4 4 0 0 1 0-8zM1 20.9V24h22v-3.1c0-3.6-5.9-5.9-11-5.9s-11 2.3-11 5.9z" />
                </svg>
                <span>Debt</span>
            </a>
            <a href="/savings" class="nav-item" data-route="savings">
                <svg class="nav-icon" fill="currentColor" viewBox="0 0 24 24">
                    <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.42 0-8-3.58-8-8s3.58-8 8-8 8 3.58 8 8-3.58 8-8 8zm.5-13H11v6l5.25 3.15.75-1.23-4.5-2.67z" />
                </svg>
                <span>Save</span>
            </a>
        </div>
    </nav>

    <!-- Floating Add Transaction button (mobile) -->
    <button
        class="btn-add-transaction-floating md:hidden"
        type="button"
        aria-label="Add Transaction"
        onclick="openAddTransactionModal()"
        title="Add Transaction"
    >
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4" />
        </svg>
    </button>

    <!-- Main Content -->
    <main id="main-content">
        {% block content %}
        <!-- Page content goes here -->
        {% endblock %}
    </main>

    <!-- Add Transaction Modal (hidden by default) -->
    <div id="add-transaction-modal" class="modal-backdrop hidden" onclick="closeAddTransactionModal(event)">
        <div class="modal-panel" onclick="event.stopPropagation()">
            <!-- Modal header -->
            <div class="flex items-center justify-between px-6 py-4 border-b border-gray-200 sticky top-0 bg-white rounded-t-2xl md:rounded-t-xl">
                <h2 class="text-lg font-bold text-gray-900">Add Transaction</h2>
                <button
                    type="button"
                    class="text-gray-500 hover:text-gray-700 text-2xl font-light leading-none"
                    aria-label="Close add transaction dialog"
                    onclick="closeAddTransactionModal()"
                >
                    ×
                </button>
            </div>

            <!-- Modal content (form placeholder) -->
            <div class="px-6 py-6">
                <p class="text-gray-600 text-center">
                    Transaction form will be wired in Phase 5.
                </p>

                <!-- Placeholder fields -->
                <form class="space-y-4 mt-4" style="display: none;">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">Date</label>
                        <input type="date" class="w-full px-4 py-2 border border-gray-300 rounded-lg" />
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">Amount</label>
                        <input type="number" class="w-full px-4 py-2 border border-gray-300 rounded-lg" placeholder="0.00" />
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">Category</label>
                        <select class="w-full px-4 py-2 border border-gray-300 rounded-lg">
                            <option>Select category...</option>
                        </select>
                    </div>
                    <div class="flex gap-2">
                        <button type="submit" class="flex-1 btn-add-transaction">
                            Save
                        </button>
                        <button
                            type="button"
                            class="flex-1 px-4 py-2 border border-gray-300 rounded-lg font-medium text-gray-700 hover:bg-gray-50"
                            onclick="closeAddTransactionModal()"
                        >
                            Cancel
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script>
        /**
         * Open the Add Transaction modal
         */
        function openAddTransactionModal() {
            const modal = document.getElementById('add-transaction-modal');
            modal.classList.remove('hidden');
            document.body.style.overflow = 'hidden';
        }

        /**
         * Close the Add Transaction modal
         * @param {Event} event - Optional click event
         */
        function closeAddTransactionModal(event) {
            // If this was a backdrop click on the modal itself (not a child), close
            if (event && event.target.id !== 'add-transaction-modal') {
                return;
            }

            const modal = document.getElementById('add-transaction-modal');
            modal.classList.add('hidden');
            document.body.style.overflow = 'auto';
        }

        /**
         * Close modal on Escape key press
         */
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                closeAddTransactionModal();
            }
        });

        /**
         * Set active nav item based on current URL
         */
        function setActiveNav() {
            const current = window.location.pathname;
            document.querySelectorAll('.nav-item').forEach((item) => {
                item.classList.remove('active');
                const route = item.getAttribute('data-route');
                const href = item.getAttribute('href') || '';

                // Match if: route matches start of pathname, OR href matches current path, OR dashboard for root
                const isActive = (route && current.startsWith('/' + route)) ||
                                current === href ||
                                (route === 'dashboard' && current === '/');

                if (isActive) {
                    item.classList.add('active');
                }
            });
        }

        // Initialize on page load
        document.addEventListener('DOMContentLoaded', setActiveNav);
    </script>

    {% block extra_js %}{% endblock %}
</body>
</html>
